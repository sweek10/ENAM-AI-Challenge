<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDF0F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121A27" media="(prefers-color-scheme: dark)">
<title>{% block title %}FINN{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF0F3; --sheet:#FFFFFF; --ink:#15213A; --slate:#5D6778; --faint:#C9D0D9;
  --mark:#F3D34A; --up:#1E7A4C; --down:#B42A22; --focus:#2F5BD3;
  --r-sheet:14px; --r-chip:999px;
  font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-variant-numeric:tabular-nums;
  color:var(--ink); background:var(--paper);
}
@media (prefers-color-scheme:dark){
  :root{--paper:#121A27; --sheet:#1A2435; --ink:#E6EBF2; --slate:#97A2B3; --faint:#2E3A4F;
        --mark:#C9A92B; --up:#4CC38A; --down:#F0746B; --focus:#86A8FF}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; line-height:1.4; font-size:15px}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:4px}
.wrap{max-width:560px; margin:0 auto; padding:max(14px, env(safe-area-inset-top)) 16px 48px}

/* top bar */
.bar{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:22px}
.word{font-stretch:75%; font-weight:800; font-size:18px; letter-spacing:.02em; text-decoration:none}
.bar nav a{font-size:14px; color:var(--slate); text-decoration:none; padding:6px 0}
.bar nav a[aria-current]{color:var(--ink); font-weight:600}
.bar nav{display:flex; gap:16px}

/* tickers: condensed, like a tape */
.tk{font-stretch:68%; font-weight:750; font-size:17px; letter-spacing:.01em}
.co{color:var(--slate); font-size:13px}
.up{color:var(--up)} .down{color:var(--down)}
.num{font-weight:600}
.muted{color:var(--slate)}
.small{font-size:13px}

/* search */
.search{display:flex; gap:8px; margin:0 0 22px}
.search input{flex:1; min-width:0; font:inherit; font-size:16px; padding:10px 12px; border-radius:12px;
  border:1px solid var(--faint); background:var(--sheet); color:var(--ink); text-transform:uppercase}
.search input::placeholder{text-transform:none; color:var(--slate)}
.search button{font:inherit; font-weight:650; padding:0 16px; border-radius:12px; border:0; background:var(--ink); color:var(--paper); cursor:pointer}
.visually-hidden{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.demo{background:var(--sheet); border:1px dashed var(--slate); border-radius:10px;
      padding:8px 12px; font-size:13px; color:var(--slate); margin-bottom:18px}
@media (prefers-reduced-motion:no-preference){ details[open] > .fold-body{animation:open .18s ease-out} }
@keyframes open{from{opacity:0; transform:translateY(-3px)} to{opacity:1; transform:none}}
</style>
{% block head %}{% endblock %}
</head>
<body>
<div class="wrap">
  <header class="bar">
    <a class="word" href="/">FINN</a>
    <nav aria-label="Main">
      <a href="/" {% if active == 'digest' %}aria-current="page"{% endif %}>Today</a>
      <a href="/research" {% if active == 'research' %}aria-current="page"{% endif %}>Research</a>
      <a href="/settings" {% if active == 'settings' %}aria-current="page"{% endif %}>Settings</a>
    </nav>
  </header>
  {% block body %}{% endblock %}
</div>
</body>
</html>
